[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pathcase"
version = "0.1.0"
description = "Batch-rename files and directories between case conventions (snake_case, kebab-case, camelCase, PascalCase)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lulu Gebi" }]
keywords = ["rename", "case", "snake-case", "kebab-case", "camelcase", "cli", "files"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.scripts]
pathcase = "pathcase.cli:main"

[project.urls]
Homepage = "https://github.com/LuluGebi/pathcase"
Issues = "https://github.com/LuluGebi/pathcase/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pathcase"]
